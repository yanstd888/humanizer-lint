<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand-lockup">
        <span class="brand">humanizer-lint</span>
        <p data-i18n="brandTagline"></p>
      </div>
      <div class="controls">
        <div class="language-toggle" role="group" data-i18n-aria-label="languageToggle">
          <button class="language-button" type="button" data-language="en" data-i18n="languageEn"></button>
          <span aria-hidden="true">/</span>
          <button class="language-button" type="button" data-language="id" data-i18n="languageId"></button>
        </div>
      </div>
    </header>

    <section class="intro" aria-labelledby="title">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 id="title" data-i18n="heading"></h1>
      <p data-i18n="intro"></p>
    </section>

    <section class="workspace" data-i18n-aria-label="workspaceLabel">
      <div class="input-panel">
        <label for="text" data-i18n="inputLabel"></label>
        <textarea id="text" rows="13" data-i18n-placeholder="placeholder"></textarea>
        <p id="error" class="error" role="alert" hidden></p>
        <button id="analyze" type="button" disabled></button>
      </div>

      <section id="result" class="result-panel" aria-live="polite" hidden>
        <div class="result-head">
          <div>
            <p class="eyebrow" data-i18n="results"></p>
            <p class="score"><span id="score">—</span><small>/100</small></p>
          </div>
          <dl class="meta">
            <div><dt data-i18n="status"></dt><dd id="status">—</dd></div>
            <div><dt data-i18n="language"></dt><dd id="language">—</dd></div>
          </dl>
        </div>
        <h2 data-i18n="findings"></h2>
        <ul id="findings"></ul>
      </section>
    </section>

    <footer>
      <div>
        <p class="eyebrow" data-i18n="cli"></p>
        <code>npx humanizer-lint --file tulisan.md --lang id</code>
      </div>
      <nav data-i18n-aria-label="projectLinks">
        <a href="https://www.npmjs.com/package/humanizer-lint">npm</a>
        <a href="https://skills.sh/yanstd888/humanizer-lint">skills.sh</a>
        <a href="https://github.com/yanstd888/humanizer-lint">GitHub</a>
      </nav>
    </footer>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
