<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)">
  <title>404: Page Not Found | humanizer-lint</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){try{var saved=localStorage.getItem('humanizer-lint.theme');var theme=saved==='light'||saved==='dark'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.classList.toggle('theme-dark',theme==='dark')}catch(error){console.error('Preference storage read failed',error);document.documentElement.dataset.storageReadFailed='true';document.addEventListener('DOMContentLoaded',function(){document.querySelector('#storage-warning').hidden=false});if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('theme-dark')}}())</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body><main class="shell not-found"><p class="eyebrow">humanizer-lint</p><h1>404: Page Not Found</h1><p>The requested page does not exist. The local prose analyzer is still available.</p><p id="storage-warning" role="status" hidden>Saved browser preferences could not be read.</p><a class="not-found-link" href="https://humanizer.aiclub.ai.id/">Return to the playground</a></main></body>
</html>
