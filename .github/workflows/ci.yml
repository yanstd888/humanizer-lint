name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.3.0", "20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      - name: Run evaluation regression check
        run: npm run eval -- --check

      - name: Run benchmark
        run: npm run benchmark

      - name: Verify documentation snapshot
        run: node scripts/docs-snapshot.mjs --check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify index excludes local artifacts
        run: test -z "$(git ls-files tasks .wrangler .pages-dist)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: project path with spaces
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run tests on Windows paths and CRLF
        working-directory: project path with spaces
        run: npm test
